# Tool configuration only. The integration is deployed as a git submodule bind-mounted
# into Home Assistant, never built or installed as a package; runtime pins live in
# custom_components/solaredge_modbus_multi/manifest.json, test pins in requirements*.txt.

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B904",  # raise from - requires significant code changes
    "B905",  # zip strict - requires significant code changes
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.solaredge_modbus_multi"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
