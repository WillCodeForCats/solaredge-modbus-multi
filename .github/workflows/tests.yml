---
name: Tests
on:
  push:
  pull_request:
    branches:
      - main
permissions: read-all
jobs:
  pytest:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: >-
          pytest tests/ -v
          --cov=custom_components/solaredge_modbus_multi
          --cov-report=term-missing
          --cov-report=json
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Check coverage of every module
        # Silver quality scale rule test-coverage: more than 95% per module
        run: |
          below=$(jq -r '.files | to_entries[]
            | select(.value.summary.percent_covered <= 95)
            | "\(.key): \(.value.summary.percent_covered_display)%"' coverage.json)
          if [ -n "$below" ]; then
            echo "Modules at or below 95% coverage:"
            echo "$below"
            exit 1
          fi
