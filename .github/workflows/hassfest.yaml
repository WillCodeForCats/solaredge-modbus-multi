name: Validate with Hassfest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
permissions: read-all
jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
      - uses: "home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3"
