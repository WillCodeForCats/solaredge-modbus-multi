name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the ZIP to (for example v4.0.13)"
        required: true
        type: string

permissions: {}

jobs:
  release-zip:
    name: Attach release ZIP
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      # Marketplace and HACS extract this archive directly into
      # custom_components/solaredge_modbus_multi, so the integration files
      # must be at the root of the ZIP, not inside a folder.
      - name: Create ZIP
        working-directory: custom_components/solaredge_modbus_multi
        run: |
          zip -r "${GITHUB_WORKSPACE}/solaredge_modbus_multi.zip" . \
            -x '*__pycache__*' '*.pyc'

      - name: Upload ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "${TAG_NAME}" solaredge_modbus_multi.zip \
            --repo "${GITHUB_REPOSITORY}" --clobber
